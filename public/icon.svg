<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0b1c30" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Radar Rings in background -->
  <circle cx="256" cy="256" r="190" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.2" fill="none" />
  <circle cx="256" cy="256" r="140" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.25" fill="none" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="90" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Central Shield -->
  <g filter="url(#dropGlow)">
    <path d="M 256 96 L 376 150 C 376 270, 256 366, 256 396 C 256 366, 136 270, 136 150 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Airplane / Radar Wings Emblem inside Shield -->
  <path d="M 256 160 L 268 220 L 320 250 L 320 265 L 268 250 L 268 300 L 285 315 L 285 328 L 256 320 L 227 328 L 227 315 L 244 300 L 244 250 L 192 265 L 192 250 L 244 220 Z" 
        fill="#ffffff" />

  <!-- PAA Text -->
  <text x="256" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
    PAA SENTINEL
  </text>
  <text x="256" y="478" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399" letter-spacing="2">
    IT ASSET HUB v5.0
  </text>
</svg>
