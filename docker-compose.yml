version: '3.8'

services:
  # Local MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: paa_sentinel_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: paa_sentinel

  # Optional MongoDB Web Admin Interface (Mongo Express on Port 8081)
  mongo-express:
    image: mongo-express:latest
    container_name: paa_sentinel_mongo_express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

volumes:
  mongo_data:
    driver: local
